[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "twice"
version = "0.2.0"
description = "Never correct your coding agent twice: find the corrections you keep repeating and measure which rules fix them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubham Gajjar" }]
keywords = ["claude-code", "coding-agents", "evals", "llm", "claude-md", "agents-md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
twice = "twice.cli:main"

[project.urls]
Homepage = "https://github.com/ShubhamGajjar/twice"
Issues = "https://github.com/ShubhamGajjar/twice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/twice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
